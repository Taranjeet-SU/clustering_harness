name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Unit and integration tests (offline, fake models)
        run: pytest -q -m "not network"

  oldest:
    # Python 3.9 with the oldest scientific stack the package supports (the pins of a production service:
    # numpy 1.22, pandas 1.1.5, scikit-learn 0.24.2, pydantic 2.13); nothing may be upgraded past them.
    # Python 3.9 is end-of-life and no longer offered by setup-python on current runners, so it runs in the
    # official python:3.9 image.
    runs-on: ubuntu-latest
    container: python:3.9
    steps:
      - uses: actions/checkout@v4
      - name: Install under the pinned constraints
        run: |
          python -m pip install "pip<25"
          pip install -c ci/constraints-py39-oldest.txt numpy==1.22.0 scipy==1.11.4 pandas==1.1.5 scikit-learn==0.24.2 numba==0.60.0 umap-learn==0.5.6 faiss-cpu==1.8.0.post1 pydantic==2.13.5
          pip install -c ci/constraints-py39-oldest.txt -e . pytest httpx
          pip list | grep -iE "^(numpy|pandas|scikit-learn|scipy|umap-learn|hdbscan|igraph|leidenalg|pydantic) "
      - name: Unit and integration tests (offline, fake models)
        run: pytest -q -m "not network"

  extras:
    # full install as a user gets it (CPU-only torch), including the real embedder against current transformers
    # and the MongoDB loader against a real server
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017
      CH_NETWORK_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with all extras (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          pip list | grep -iE "^(torch|transformers|sentence-transformers|datasets|anthropic|openai) "
      - name: All tests, including real embedder and dataset downloads
        run: pytest -q
