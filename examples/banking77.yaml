# Reproduces the BANKING77 row of the README "Validation" table (gpt-4o-mini in both model slots, CPU embeddings).
#   export OPENAI_API_KEY=...
#   clustering-harness -v run examples/banking77.yaml                       # 10-15 min, ~$0.50
#   clustering-harness compare examples/banking77.yaml --baselines kmeans:k=77 agglomerative_cosine_average:k=77 \
#       umap_hdbscan:min_cluster_size=10 hdbscan:min_cluster_size=10 leiden_knn:resolution=1.0      # the full README table
#   add --judge --judge-max-clusters 40 for the LLM-judge column (~$0.15)
workdir: runs/banking77
data: {dataset: banking77, split: test}
pipeline:
  preset: small
  prompts: default
  domain:
    product: a digital bank
    product_description: "a mobile banking app: cards, top-ups, transfers, payments, exchange rates, identity verification and account security"
models:
  a: {name: gpt4omini_a, backend: openai, model: gpt-4o-mini, concurrency: 8, budget_usd: 5}
  b: {name: gpt4omini, backend: openai, model: gpt-4o-mini, concurrency: 8, budget_usd: 5}
embedder: {backend: hf, model: Alibaba-NLP/gte-large-en-v1.5, device: cpu, half: false}   # device: cuda for a GPU
label_embedder: {backend: st, model: BAAI/bge-large-en-v1.5, device: cpu}
# budget_usd caps spend per model for this run (ledger: <workdir>/spend.sqlite). Set `ledger:` to a shared path to cap
# the combined spend of several runs instead.
